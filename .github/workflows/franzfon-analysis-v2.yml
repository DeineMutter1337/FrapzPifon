name: FRANZFON Phase 2 Analysis v2 CURRENT
run-name: "FRANZFON Analysis v2 • ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/franzfon-analysis-v2.yml'
      - 'scripts/analyze_franzfon_loop.sh'
      - 'scripts/stream_vma_extract.py'

permissions:
  contents: write

concurrency:
  group: franzfon-phase2-analysis-v2
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Show workflow revision
        run: |
          echo "Workflow: FRANZFON Phase 2 Analysis v2 CURRENT"
          echo "Commit: $GITHUB_SHA"
          git log -1 --oneline

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc 2>/dev/null || true
          df -hT

      - name: Install analysis tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip zstd file jq util-linux parted lvm2 \
            e2fsprogs xfsprogs btrfs-progs kpartx
          python3 -m pip install --user zstandard
          losetup --version | head -n1
          lvm version | head -n8

      - name: Analyze appliance with direct read-only loop mount
        id: analysis
        run: |
          mkdir -p report
          set +e
          bash scripts/analyze_franzfon_loop.sh 2>&1 | tee report/run.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > report/exit-code.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

          sed -ri \
            -e 's#([A-Za-z0-9_]*(PASSWORD|PASS|TOKEN|SECRET|PRIVATE_KEY|API_KEY)[A-Za-z0-9_]*[=:])[[:space:]]*[^[:space:]]+#\1[REDACTED]#Ig' \
            -e 's#(Authorization:[[:space:]]*(Bearer|Basic))[[:space:]]+[^[:space:]]+#\1 [REDACTED]#Ig' \
            -e 's#([a-zA-Z][a-zA-Z0-9+.-]*://)[^/@[:space:]]+:[^/@[:space:]]+@#\1[REDACTED]@#g' \
            report/run.log 2>/dev/null || true

          exit 0

      - name: Upload sanitized analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franzfon-phase2-analysis-v2
          path: report/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Publish latest sanitized diagnostics
        if: always()
        run: |
          set -euxo pipefail
          rm -rf analysis-results/v2/latest
          mkdir -p analysis-results/v2/latest
          find report -maxdepth 1 -type f \( -name '*.txt' -o -name '*.log' \) \
            -exec cp {} analysis-results/v2/latest/ \;

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/v2/latest

          if ! git diff --cached --quiet; then
            git commit -m 'Update latest FRANZFON v2 analysis'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No diagnostic changes to commit.'
          fi

      - name: Mark analysis failure after publishing diagnostics
        if: always()
        run: |
          RC='${{ steps.analysis.outputs.rc }}'
          if [ -z "$RC" ]; then RC=1; fi
          if [ "$RC" != '0' ]; then
            echo "Analysis v2 failed with exit code $RC. Diagnostics are in analysis-results/v2/latest/." >&2
            exit "$RC"
          fi
          echo 'FRANZFON analysis v2 completed successfully.'
