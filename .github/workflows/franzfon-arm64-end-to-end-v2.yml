name: FRANZFON ARM64 End-to-End Validation v2
run-name: "FRANZFON ARM64 staged E2E v2 • ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'scripts/stream_vma_extract.py'
      - '.github/workflows/franzfon-arm64-end-to-end-v2.yml'

permissions:
  contents: write

concurrency:
  group: franzfon-arm64-e2e-v2
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      rc: ${{ steps.prepare.outputs.rc }}

    steps:
      - uses: actions/checkout@v4

      - name: Confirm native ARM64 runner
        run: |
          set -euxo pipefail
          test "$(uname -m)" = aarch64
          df -hT

      - name: Prepare sanitized payload
        id: prepare
        run: |
          mkdir -p report
          set +e
          sudo bash installer/franzfon-arm64-prepare.sh \
            --output /var/lib/franzfon-arm64/payload \
            --workdir /var/tmp/franzfon-arm64-e2e-v2-prepare \
            2>&1 | tee report/prepare.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          {
            echo 'STAGE=prepare'
            echo "RC=$RC"
            if [ "$RC" = 0 ]; then echo 'VERDICT=PASS'; else echo 'VERDICT=FAIL'; fi
          } > report/prepare-verdict.txt
          exit 0

      - name: Package sanitized payload
        if: steps.prepare.outputs.rc == '0'
        run: |
          set -euxo pipefail
          sudo tar --numeric-owner -C /var/lib/franzfon-arm64 \
            -czf "$GITHUB_WORKSPACE/payload.tar.gz" payload
          sudo chown "$(id -u):$(id -g)" payload.tar.gz
          sha256sum payload.tar.gz > report/payload-sha256.txt

      - name: Upload payload
        if: steps.prepare.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: franzfon-e2e-v2-payload
          path: payload.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload prepare report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franzfon-e2e-v2-prepare-report
          path: report/
          if-no-files-found: error
          retention-days: 14

      - name: Fail failed prepare stage
        if: always()
        run: test '${{ steps.prepare.outputs.rc }}' = '0'

  app:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    outputs:
      rc: ${{ steps.app.outputs.rc }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: franzfon-e2e-v2-payload
          path: artifacts/payload

      - name: Restore payload
        run: |
          set -euxo pipefail
          sudo mkdir -p /var/lib/franzfon-arm64
          sudo tar -xzf artifacts/payload/payload.tar.gz -C /var/lib/franzfon-arm64

      - name: Install and validate application stage
        id: app
        run: |
          mkdir -p report
          set +e
          (
            set -euxo pipefail
            sudo bash installer/franzfon-arm64-install-app.sh \
              --payload /var/lib/franzfon-arm64/payload
            test "$(/usr/local/bin/node -p process.arch)" = arm64
            file /opt/franzfon/wizard/backend/node_modules/better-sqlite3/build/Release/better_sqlite3.node \
              | grep -E 'ARM aarch64|ARM64'
            systemctl is-enabled franzfon-wizard.service >/dev/null 2>&1 && exit 20 || true
            systemctl is-active franzfon-wizard.service >/dev/null 2>&1 && exit 21 || true
          ) 2>&1 | tee report/app.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          {
            echo 'STAGE=app'
            echo "RC=$RC"
            if [ "$RC" = 0 ]; then echo 'VERDICT=PASS'; else echo 'VERDICT=FAIL'; fi
          } > report/app-verdict.txt
          exit 0

      - name: Upload app report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franzfon-e2e-v2-app-report
          path: report/
          if-no-files-found: error
          retention-days: 14

      - name: Fail failed app stage
        if: always()
        run: test '${{ steps.app.outputs.rc }}' = '0'

  asterisk:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    outputs:
      rc: ${{ steps.asterisk.outputs.rc }}

    steps:
      - uses: actions/checkout@v4

      - name: Install and validate native Asterisk
        id: asterisk
        run: |
          mkdir -p report
          set +e
          (
            set -euxo pipefail
            sudo bash installer/franzfon-arm64-install-asterisk.sh \
              --workdir /var/tmp/franzfon-arm64-e2e-v2-asterisk
            file /opt/franzfon-arm64/asterisk/sbin/asterisk \
              | grep -E 'ARM aarch64|ARM64'
            /opt/franzfon-arm64/asterisk/sbin/asterisk -V
            ldconfig -p | grep -F 'libasteriskssl.so.1'
            systemctl is-enabled asterisk.service >/dev/null 2>&1 && exit 30 || true
            systemctl is-active asterisk.service >/dev/null 2>&1 && exit 31 || true
          ) 2>&1 | tee report/asterisk.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          {
            echo 'STAGE=asterisk'
            echo "RC=$RC"
            if [ "$RC" = 0 ]; then echo 'VERDICT=PASS'; else echo 'VERDICT=FAIL'; fi
          } > report/asterisk-verdict.txt
          exit 0

      - name: Package validated Asterisk runtime
        if: steps.asterisk.outputs.rc == '0'
        run: |
          set -euxo pipefail
          sudo tar --numeric-owner -C / \
            -czf "$GITHUB_WORKSPACE/asterisk-runtime.tar.gz" \
            opt/franzfon-arm64/asterisk \
            etc/ld.so.conf.d/franzfon-asterisk.conf \
            etc/systemd/system/asterisk.service
          sudo chown "$(id -u):$(id -g)" asterisk-runtime.tar.gz
          sha256sum asterisk-runtime.tar.gz > report/asterisk-runtime-sha256.txt

      - name: Upload Asterisk runtime
        if: steps.asterisk.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: franzfon-e2e-v2-asterisk-runtime
          path: asterisk-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Asterisk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franzfon-e2e-v2-asterisk-report
          path: report/
          if-no-files-found: error
          retention-days: 14

      - name: Fail failed Asterisk stage
        if: always()
        run: test '${{ steps.asterisk.outputs.rc }}' = '0'

  integration:
    needs: [prepare, app, asterisk]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    outputs:
      rc: ${{ steps.integration.outputs.rc }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: franzfon-e2e-v2-payload
          path: artifacts/payload

      - uses: actions/download-artifact@v4
        with:
          name: franzfon-e2e-v2-asterisk-runtime
          path: artifacts/asterisk

      - name: Restore validated inputs
        run: |
          set -euxo pipefail
          sudo mkdir -p /var/lib/franzfon-arm64
          sudo tar -xzf artifacts/payload/payload.tar.gz -C /var/lib/franzfon-arm64
          if ! getent group asterisk >/dev/null; then sudo groupadd --system asterisk; fi
          if ! id asterisk >/dev/null 2>&1; then
            sudo useradd --system --gid asterisk --home-dir /var/lib/asterisk \
              --shell /usr/sbin/nologin asterisk
          fi
          sudo tar -xzf artifacts/asterisk/asterisk-runtime.tar.gz -C /
          sudo ldconfig
          sudo systemctl daemon-reload

      - name: Install app, bootstrap and validate complete stack
        id: integration
        run: |
          mkdir -p report
          set +e
          (
            set -euxo pipefail
            sudo bash installer/franzfon-arm64-install-app.sh \
              --payload /var/lib/franzfon-arm64/payload
            sudo bash installer/franzfon-arm64-bootstrap.sh --activate

            test "$(/usr/local/bin/node -p process.arch)" = arm64
            systemctl is-active --quiet mariadb.service
            systemctl is-active --quiet redis-server.service
            systemctl is-active --quiet asterisk.service
            systemctl is-active --quiet franzfon-wizard.service

            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'core show version'
            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'module show like chan_pjsip.so' \
              | grep -F chan_pjsip.so
            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'module show like res_http_websocket.so' \
              | grep -F res_http_websocket.so
            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'module show like res_odbc.so' \
              | grep -F res_odbc.so
            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'odbc show' \
              | grep -F asteriskcdrdb

            curl --fail --location --silent --show-error --max-time 10 \
              http://127.0.0.1:3000/ \
              --output /tmp/franzfon-index.html
            test -s /tmp/franzfon-index.html
            grep -Eiq 'franzfon|<!doctype html|<html' /tmp/franzfon-index.html

            grep -F 'LICENSE_STATE_IMPORTED=no' /etc/franzfon-arm64/install-state
            grep -F 'FREEPBX_REQUIRED=no' /etc/franzfon-arm64/install-state
            grep -F 'STACK_ENABLED=yes' /etc/franzfon-arm64/install-state

            if find /opt/franzfon /opt/franzfon-arm64 -type f -print0 \
              | while IFS= read -r -d '' path; do
                  description="$(file -b "$path" 2>/dev/null || true)"
                  case "$description" in
                    *x86-64*|*Intel\ 80386*|*PE32*) echo "$path" ;;
                  esac
                done | grep -q .; then
              echo 'Unexpected x86 executable remains in native installation.' >&2
              exit 40
            fi
          ) 2>&1 | tee report/integration.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          {
            echo 'STAGE=integration'
            echo "RC=$RC"
            if [ "$RC" = 0 ]; then echo 'VERDICT=PASS'; else echo 'VERDICT=FAIL'; fi
          } > report/integration-verdict.txt
          exit 0

      - name: Collect sanitized service diagnostics
        if: always()
        run: |
          set +e
          sudo systemctl --no-pager --full status \
            mariadb.service redis-server.service asterisk.service franzfon-wizard.service \
            > report/service-status.log 2>&1
          sudo journalctl --no-pager -n 400 \
            -u asterisk.service -u franzfon-wizard.service \
            > report/service-journal.log 2>&1
          if [ -f /opt/franzfon/config/database.env ]; then
            while IFS='=' read -r key value; do
              case "$key" in
                SESSION_SECRET|CDR_DB_PASSWORD)
                  [ -n "$value" ] || continue
                  find report -type f -print0 \
                    | xargs -0 sed -i "s#${value}#[REDACTED_${key}]#g"
                  ;;
              esac
            done < /opt/franzfon/config/database.env
          fi
          exit 0

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franzfon-e2e-v2-integration-report
          path: report/
          if-no-files-found: error
          retention-days: 14

      - name: Fail failed integration stage
        if: always()
        run: test '${{ steps.integration.outputs.rc }}' = '0'

  publish:
    if: always()
    needs: [prepare, app, asterisk, integration]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all available stage reports
        uses: actions/download-artifact@v4
        with:
          pattern: franzfon-e2e-v2-*-report
          path: collected
          merge-multiple: true

      - name: Build and publish staged verdict
        run: |
          set -euxo pipefail
          rm -rf analysis-results/arm64-end-to-end-v2/latest
          mkdir -p analysis-results/arm64-end-to-end-v2/latest
          cp -a collected/. analysis-results/arm64-end-to-end-v2/latest/

          PREPARE='${{ needs.prepare.result }}'
          APP='${{ needs.app.result }}'
          ASTERISK='${{ needs.asterisk.result }}'
          INTEGRATION='${{ needs.integration.result }}'
          {
            echo 'RUN_MARKER=FRANZFON_ARM64_STAGED_E2E_V2'
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "PREPARE_JOB=$PREPARE"
            echo "APP_JOB=$APP"
            echo "ASTERISK_JOB=$ASTERISK"
            echo "INTEGRATION_JOB=$INTEGRATION"
            echo
            if [ "$PREPARE" = success ] \
              && [ "$APP" = success ] \
              && [ "$ASTERISK" = success ] \
              && [ "$INTEGRATION" = success ]; then
              echo 'VERDICT=PASS'
              echo 'Payload, app, Asterisk and complete running stack passed as separate native ARM64 stages.'
            else
              echo 'VERDICT=FAIL'
              echo 'Open the first stage-specific verdict or log that is not successful.'
            fi
          } > analysis-results/arm64-end-to-end-v2/latest/verdict.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/arm64-end-to-end-v2/latest
          if ! git diff --cached --quiet; then
            git commit -m 'Update staged FRANZFON ARM64 end-to-end v2 verdict'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Mark failed staged validation
        if: always()
        run: grep -F 'VERDICT=PASS' analysis-results/arm64-end-to-end-v2/latest/verdict.txt
