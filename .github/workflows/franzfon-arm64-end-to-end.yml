name: FRANZFON ARM64 End-to-End Validation
run-name: "FRANZFON ARM64 E2E • ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'scripts/stream_vma_extract.py'
      - '.github/workflows/franzfon-arm64-end-to-end.yml'

permissions:
  contents: write

concurrency:
  group: franzfon-arm64-e2e-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Confirm native ARM64 runner
        run: |
          set -euxo pipefail
          uname -a
          test "$(uname -m)" = aarch64
          df -hT

      - name: Prepare clean application payload from official appliance
        id: prepare
        run: |
          set +e
          mkdir -p e2e-report
          sudo bash installer/franzfon-arm64-prepare.sh \
            --output /var/lib/franzfon-arm64/payload \
            --workdir /var/tmp/franzfon-arm64-e2e-prepare \
            2>&1 | tee e2e-report/prepare.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > e2e-report/prepare-exit-code.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install native application stage
        id: app
        if: steps.prepare.outputs.rc == '0'
        run: |
          set +e
          sudo bash installer/franzfon-arm64-install-app.sh \
            --payload /var/lib/franzfon-arm64/payload \
            2>&1 | tee e2e-report/app-install.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > e2e-report/app-exit-code.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install native Asterisk stage
        id: asterisk
        if: steps.prepare.outputs.rc == '0' && steps.app.outputs.rc == '0'
        run: |
          set +e
          sudo bash installer/franzfon-arm64-install-asterisk.sh \
            --workdir /var/tmp/franzfon-arm64-e2e-asterisk \
            2>&1 | tee e2e-report/asterisk-install.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > e2e-report/asterisk-exit-code.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Bootstrap and activate complete stack
        id: bootstrap
        if: steps.prepare.outputs.rc == '0' && steps.app.outputs.rc == '0' && steps.asterisk.outputs.rc == '0'
        run: |
          set +e
          sudo bash installer/franzfon-arm64-bootstrap.sh --activate \
            2>&1 | tee e2e-report/bootstrap.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > e2e-report/bootstrap-exit-code.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run functional assertions
        id: functional
        if: steps.bootstrap.outputs.rc == '0'
        run: |
          set +e
          (
            set -euxo pipefail
            test "$(/usr/local/bin/node -p process.arch)" = arm64
            file /opt/franzfon/wizard/backend/node_modules/better-sqlite3/build/Release/better_sqlite3.node \
              | grep -E 'ARM aarch64|ARM64'
            file /opt/franzfon-arm64/asterisk/sbin/asterisk \
              | grep -E 'ARM aarch64|ARM64'

            systemctl is-active --quiet mariadb.service
            systemctl is-active --quiet redis-server.service
            systemctl is-active --quiet asterisk.service
            systemctl is-active --quiet franzfon-wizard.service

            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'core show version'
            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'module show like chan_pjsip.so' \
              | grep -F chan_pjsip.so
            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'module show like res_http_websocket.so' \
              | grep -F res_http_websocket.so
            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'module show like res_odbc.so' \
              | grep -F res_odbc.so
            /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'odbc show' \
              | grep -F asteriskcdrdb

            curl --fail --location --silent --show-error --max-time 10 \
              http://127.0.0.1:3000/ \
              --output /tmp/franzfon-index.html
            test -s /tmp/franzfon-index.html
            grep -Eiq 'franzfon|<!doctype html|<html' /tmp/franzfon-index.html

            grep -F 'LICENSE_STATE_IMPORTED=no' /etc/franzfon-arm64/install-state
            grep -F 'FREEPBX_REQUIRED=no' /etc/franzfon-arm64/install-state
            grep -F 'STACK_ENABLED=yes' /etc/franzfon-arm64/install-state

            if find /opt/franzfon /opt/franzfon-arm64 -type f -print0 \
              | while IFS= read -r -d '' path; do
                  description="$(file -b "$path" 2>/dev/null || true)"
                  case "$description" in
                    *x86-64*|*Intel\ 80386*|*PE32*) echo "$path" ;;
                  esac
                done \
              | grep -q .; then
              echo 'Unexpected x86 executable remains in the native installation.' >&2
              exit 1
            fi
          ) 2>&1 | tee e2e-report/functional.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > e2e-report/functional-exit-code.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect sanitized diagnostics
        if: always()
        run: |
          set +e
          sudo systemctl --no-pager --full status \
            mariadb.service redis-server.service asterisk.service franzfon-wizard.service \
            > e2e-report/service-status.log 2>&1
          sudo journalctl --no-pager -n 300 \
            -u asterisk.service -u franzfon-wizard.service \
            > e2e-report/service-journal.log 2>&1
          sudo /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'core show version' \
            > e2e-report/asterisk-version.txt 2>&1
          sudo /opt/franzfon-arm64/asterisk/sbin/asterisk -rx 'module show' \
            > e2e-report/asterisk-modules.txt 2>&1

          if [ -f /opt/franzfon/config/database.env ]; then
            while IFS='=' read -r key value; do
              case "$key" in
                SESSION_SECRET|CDR_DB_PASSWORD)
                  [ -n "$value" ] || continue
                  find e2e-report -type f -print0 \
                    | xargs -0 sed -i "s#${value}#[REDACTED_${key}]#g"
                  ;;
              esac
            done < /opt/franzfon/config/database.env
          fi
          exit 0

      - name: Build final verdict
        if: always()
        run: |
          PREP='${{ steps.prepare.outputs.rc }}'; : "${PREP:=1}"
          APP='${{ steps.app.outputs.rc }}'; : "${APP:=1}"
          AST='${{ steps.asterisk.outputs.rc }}'; : "${AST:=1}"
          BOOT='${{ steps.bootstrap.outputs.rc }}'; : "${BOOT:=1}"
          FUNC='${{ steps.functional.outputs.rc }}'; : "${FUNC:=1}"

          {
            echo 'RUN_MARKER=FRANZFON_ARM64_E2E_V1'
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "PREPARE_RC=$PREP"
            echo "APP_INSTALL_RC=$APP"
            echo "ASTERISK_INSTALL_RC=$AST"
            echo "BOOTSTRAP_RC=$BOOT"
            echo "FUNCTIONAL_RC=$FUNC"
            echo
            if [ "$PREP" = 0 ] && [ "$APP" = 0 ] && [ "$AST" = 0 ] && [ "$BOOT" = 0 ] && [ "$FUNC" = 0 ]; then
              echo 'VERDICT=PASS'
              echo 'The clean FRANZFON stack installed, bootstrapped and served HTTP on native ARM64 without FreePBX or x86 executables.'
            else
              echo 'VERDICT=FAIL'
              echo 'See the stage logs for the first non-zero return code.'
            fi
          } > e2e-report/verdict.txt

      - name: Remove extracted application and secrets
        if: always()
        run: |
          sudo systemctl stop franzfon-wizard.service asterisk.service 2>/dev/null || true
          sudo rm -rf \
            /var/lib/franzfon-arm64/payload \
            /var/tmp/franzfon-arm64-e2e-prepare \
            /var/tmp/franzfon-arm64-e2e-asterisk \
            /opt/franzfon \
            /opt/franzfon-arm64 \
            /opt/franzfon/config/database.env

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franzfon-arm64-e2e-v1-logs
          path: e2e-report/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Publish sanitized result
        if: always()
        run: |
          set -euxo pipefail
          rm -rf analysis-results/arm64-end-to-end/latest
          mkdir -p analysis-results/arm64-end-to-end/latest
          find e2e-report -maxdepth 1 -type f \( -name '*.txt' -o -name '*.log' \) \
            -exec cp {} analysis-results/arm64-end-to-end/latest/ \;

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/arm64-end-to-end/latest
          if ! git diff --cached --quiet; then
            git commit -m 'Update FRANZFON native ARM64 end-to-end validation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Mark workflow failure after publishing logs
        if: always()
        run: |
          grep -F 'VERDICT=PASS' e2e-report/verdict.txt
