name: FRANZFON Asterisk ARM64 Debian 12 Release Bundle
run-name: "Asterisk 22.7 ARM64 Bookworm Bundle • ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installer/franzfon-arm64-install-asterisk.sh'
      - '.github/workflows/franzfon-asterisk-arm64-release.yml'

permissions:
  contents: write

concurrency:
  group: franzfon-asterisk-arm64-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
    timeout-minutes: 90
    env:
      RELEASE_TAG: asterisk-22.7.0-arm64-bookworm-v2
      ASSET_NAME: franzfon-asterisk-22.7.0-linux-arm64.tar.zst

    steps:
      - name: Install runner tooling inside Debian 12
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git gh zstd binutils file

      - uses: actions/checkout@v4

      - name: Provide non-booted systemd shim for bundle build
        run: |
          cat > /usr/local/bin/systemctl <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            daemon-reload|disable|stop) exit 0 ;;
            is-enabled|is-active) exit 1 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod 0755 /usr/local/bin/systemctl

      - name: Build with the production ARM64 installer on Debian 12
        run: |
          bash installer/franzfon-arm64-install-asterisk.sh --keep-work

      - name: Validate Debian 12 compatibility and package runtime
        run: |
          set -euxo pipefail
          BINARY=/opt/franzfon-arm64/asterisk/sbin/asterisk
          test "$(readelf -h "$BINARY" | awk '$1 == "Machine:" {print $2}')" = AArch64
          test -s /var/lib/asterisk/documentation/core-en_US.xml
          "$BINARY" -V
          ldd --version | head -n 1
          mkdir -p dist
          tar --zstd -C / -cf "dist/$ASSET_NAME" \
            opt/franzfon-arm64/asterisk \
            var/lib/asterisk
          sha256sum "dist/$ASSET_NAME" > "dist/$ASSET_NAME.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: franzfon-asterisk-22.7.0-arm64-bookworm-v2
          path: dist/
          retention-days: 30
          compression-level: 0

      - name: Publish immutable Debian 12 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title 'FRANZFON Asterisk 22.7.0 ARM64 Debian 12 bundle v2' \
              --notes 'Native AArch64 build compiled inside Debian 12 Bookworm for Raspberry Pi OS and Debian 12 compatibility. The installer verifies SHA-256, ELF architecture, required modules and executes the staged binary before publication.'
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
