name: FRANZFON ARM64 Installer Static CI
run-name: "Installer Static CI • ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'scripts/stream_vma_extract.py'
      - 'scripts/configuration_contract_audit.sh'
      - '.github/workflows/franzfon-installer-static-ci.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3

      - name: Bash syntax
        id: bash_syntax
        run: |
          set -euxo pipefail
          bash -n installer/franzfon-arm64-install.sh
          bash -n installer/franzfon-arm64-prepare.sh
          bash -n installer/franzfon-arm64-install-app.sh
          bash -n installer/franzfon-arm64-normalize-native-addons.sh
          bash -n installer/franzfon-arm64-install-asterisk.sh
          bash -n installer/franzfon-arm64-bootstrap.sh
          bash -n installer/franzfon-arm64-selftest.sh
          bash -n scripts/configuration_contract_audit.sh

      - name: ShellCheck
        id: shellcheck
        run: |
          set -euxo pipefail
          shellcheck --severity=warning \
            installer/franzfon-arm64-install.sh \
            installer/franzfon-arm64-prepare.sh \
            installer/franzfon-arm64-install-app.sh \
            installer/franzfon-arm64-normalize-native-addons.sh \
            installer/franzfon-arm64-install-asterisk.sh \
            installer/franzfon-arm64-bootstrap.sh \
            installer/franzfon-arm64-selftest.sh \
            scripts/configuration_contract_audit.sh

      - name: Python syntax
        id: python_syntax
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/stream_vma_extract.py

      - name: Installer safety assertions
        id: safety
        run: |
          set -euxo pipefail

          grep -F -- 'ACTIVATE=0' installer/franzfon-arm64-install.sh
          grep -F -- '[ "$ACTIVATE" -eq 0 ] || BOOTSTRAP_ARGS+=(--activate)' installer/franzfon-arm64-install.sh
          grep -F -- 'bash "$SELFTEST"' installer/franzfon-arm64-install.sh
          grep -F -- 'systemctl disable franzfon-wizard.service' installer/franzfon-arm64-install-app.sh
          grep -F -- 'systemctl disable asterisk.service' installer/franzfon-arm64-install-asterisk.sh
          grep -F -- 'if [ "$ACTIVATE" -eq 1 ]' installer/franzfon-arm64-bootstrap.sh
          grep -F -- 'LICENSE_STATE_IMPORTED=no' installer/franzfon-arm64-bootstrap.sh

          ! grep -RE -- 'systemctl enable --now (franzfon-wizard|asterisk)' installer
          ! grep -RE -- '^ACTIVATE=1$' installer

          grep -F -- "--exclude='node_modules/'" installer/franzfon-arm64-prepare.sh
          grep -F -- "--exclude='*.db'" installer/franzfon-arm64-prepare.sh
          grep -F -- "--exclude='*.env'" installer/franzfon-arm64-prepare.sh
          grep -F -- "--exclude='/data/'" installer/franzfon-arm64-prepare.sh
          grep -F -- "-name 'german-holidays*'" installer/franzfon-arm64-prepare.sh

          grep -F -- 'better_sqlite3.node' installer/franzfon-arm64-normalize-native-addons.sh
          grep -F -- 'assert_aarch64_elf' installer/franzfon-arm64-normalize-native-addons.sh
          grep -F -- 'No application code, license checks or runtime data are modified.' \
            installer/franzfon-arm64-normalize-native-addons.sh

          grep -F -- '5b0e5d276aeb014bf8a08a94d1055a9e97b9dce3375846eea70da5221bf9efe7' \
            installer/franzfon-arm64-install-asterisk.sh
          grep -F -- 'Required module missing:' installer/franzfon-arm64-install-asterisk.sh
          grep -F -- 'ARM\ aarch64' installer/franzfon-arm64-install-asterisk.sh
          grep -F -- '/etc/ld.so.conf.d/franzfon-asterisk.conf' installer/franzfon-arm64-install-asterisk.sh
          grep -F -- 'ldconfig -p' installer/franzfon-arm64-install-asterisk.sh
          grep -F -- "CREATE USER IF NOT EXISTS 'franzfon'@'localhost'" installer/franzfon-arm64-bootstrap.sh
          grep -F -- '#include pjsip_custom.conf' installer/franzfon-arm64-bootstrap.sh
          grep -F -- 'ASTERISK_STABLE=0' installer/franzfon-arm64-bootstrap.sh

          grep -F -- "HTTP_URL='http://127.0.0.1:3000/'" installer/franzfon-arm64-selftest.sh
          grep -F -- 'No passwords, database contents or license data are printed or modified.' \
            installer/franzfon-arm64-selftest.sh
          grep -F -- 'Unexpected x86 executable' installer/franzfon-arm64-selftest.sh
          ! grep -E -- '(cat|grep|sed|awk).*(database\.env|SESSION_SECRET|CDR_DB_PASSWORD)' \
            installer/franzfon-arm64-selftest.sh

          ! grep -REi -- \
            'SKIP_LICENSE|DISABLE_LICENSE|LICENSE_BYPASS|BYPASS_ACTIVATION|FORCE_ACTIVATED|licenseCheck[[:space:]]*=[[:space:]]*false' \
            installer scripts

      - name: Help output smoke tests
        id: help_smoke
        run: |
          set -euxo pipefail
          bash installer/franzfon-arm64-install.sh --help
          bash installer/franzfon-arm64-prepare.sh --help
          bash installer/franzfon-arm64-install-app.sh --help
          bash installer/franzfon-arm64-normalize-native-addons.sh --help
          bash installer/franzfon-arm64-install-asterisk.sh --help
          bash installer/franzfon-arm64-bootstrap.sh --help
          bash installer/franzfon-arm64-selftest.sh --help

      - name: Publish static CI verdict
        if: always()
        run: |
          set -euxo pipefail
          rm -rf analysis-results/installer-static/latest
          mkdir -p analysis-results/installer-static/latest
          {
            echo 'RUN_MARKER=FRANZFON_ARM64_INSTALLER_STATIC_V1'
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo 'BASH_SYNTAX=${{ steps.bash_syntax.outcome }}'
            echo 'SHELLCHECK=${{ steps.shellcheck.outcome }}'
            echo 'PYTHON_SYNTAX=${{ steps.python_syntax.outcome }}'
            echo 'SAFETY_ASSERTIONS=${{ steps.safety.outcome }}'
            echo 'HELP_SMOKE=${{ steps.help_smoke.outcome }}'
            echo
            if [ '${{ steps.bash_syntax.outcome }}' = success ] \
              && [ '${{ steps.shellcheck.outcome }}' = success ] \
              && [ '${{ steps.python_syntax.outcome }}' = success ] \
              && [ '${{ steps.safety.outcome }}' = success ] \
              && [ '${{ steps.help_smoke.outcome }}' = success ]; then
              echo 'VERDICT=PASS'
            else
              echo 'VERDICT=FAIL'
            fi
          } > analysis-results/installer-static/latest/verdict.txt

          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/installer-static/latest/verdict.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update FRANZFON ARM64 installer static verdict'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
