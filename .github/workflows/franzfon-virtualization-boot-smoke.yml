name: FRANZFON ARM64 VM Boot Smoke
run-name: "ARM64 VM Boot Smoke • ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/franzfon-virtualization-boot-smoke.yml'

concurrency:
  group: franzfon-arm64-vm-boot-smoke
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  boot-checkpoint-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH test client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass netcat-openbsd

      - name: Build and start ARM64 VM
        id: first_boot
        working-directory: virtualization
        run: |
          set -euxo pipefail
          docker compose up -d --build

          ready=0
          for _ in $(seq 1 300); do
            if nc -z 127.0.0.1 2222; then
              if sshpass -p franzfon ssh \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=5 \
                -p 2222 franzfon@127.0.0.1 \
                'test -f /var/lib/franzfon-lab-ready && test "$(uname -m)" = aarch64'; then
                ready=1
                break
              fi
            fi
            sleep 3
          done
          [ "$ready" -eq 1 ]

          sshpass -p franzfon ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 franzfon@127.0.0.1 \
            'test -d ~/FrapzPifon/.git && git -C ~/FrapzPifon rev-parse --is-inside-work-tree'

      - name: Power off through QMP
        id: poweroff
        if: steps.first_boot.outcome == 'success'
        working-directory: virtualization
        run: |
          set -euxo pipefail
          docker compose exec -T vm /usr/local/bin/labctl poweroff
          timeout 120 docker wait franzfon-arm64-lab >/dev/null
          docker compose down

      - name: Create boot checkpoint
        id: checkpoint
        if: steps.poweroff.outcome == 'success'
        working-directory: virtualization
        run: |
          set -euxo pipefail
          docker compose run --rm --no-deps \
            --entrypoint /usr/local/bin/labctl \
            vm checkpoint boot-green
          test -s state/checkpoints/boot-green.qcow2

      - name: Boot from checkpoint
        id: restore_boot
        if: steps.checkpoint.outcome == 'success'
        working-directory: virtualization
        run: |
          set -euxo pipefail
          docker compose up -d

          ready=0
          for _ in $(seq 1 180); do
            if nc -z 127.0.0.1 2222; then
              if sshpass -p franzfon ssh \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=5 \
                -p 2222 franzfon@127.0.0.1 \
                'test -f /var/lib/franzfon-lab-ready && test "$(uname -m)" = aarch64'; then
                ready=1
                break
              fi
            fi
            sleep 3
          done
          [ "$ready" -eq 1 ]

      - name: Collect QEMU log
        if: always()
        working-directory: virtualization
        run: |
          mkdir -p ../analysis-results/virtualization-boot/latest
          docker compose logs --no-color vm \
            > ../analysis-results/virtualization-boot/latest/qemu.log 2>&1 || true
          tail -n 300 ../analysis-results/virtualization-boot/latest/qemu.log \
            > ../analysis-results/virtualization-boot/latest/qemu-tail.log || true

      - name: Publish VM boot verdict
        if: always()
        run: |
          set -euxo pipefail
          result_dir='analysis-results/virtualization-boot/latest'
          mkdir -p "$result_dir"
          {
            echo 'RUN_MARKER=FRANZFON_ARM64_VM_BOOT_SMOKE_V1'
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo 'FIRST_BOOT=${{ steps.first_boot.outcome }}'
            echo 'QMP_POWEROFF=${{ steps.poweroff.outcome }}'
            echo 'CHECKPOINT=${{ steps.checkpoint.outcome }}'
            echo 'RESTORE_BOOT=${{ steps.restore_boot.outcome }}'
            echo
            if [ '${{ steps.first_boot.outcome }}' = success ] \
              && [ '${{ steps.poweroff.outcome }}' = success ] \
              && [ '${{ steps.checkpoint.outcome }}' = success ] \
              && [ '${{ steps.restore_boot.outcome }}' = success ]; then
              echo 'VERDICT=PASS'
            else
              echo 'VERDICT=FAIL'
            fi
          } > "$result_dir/verdict.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add "$result_dir/verdict.txt" "$result_dir/qemu-tail.log"
          if ! git diff --cached --quiet; then
            git commit -m 'Update FRANZFON ARM64 VM boot smoke verdict'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Stop VM
        if: always()
        working-directory: virtualization
        run: |
          docker compose exec -T vm /usr/local/bin/labctl poweroff 2>/dev/null || true
          timeout 60 docker wait franzfon-arm64-lab >/dev/null 2>&1 || true
          docker compose down || true
