name: FRANZFON ARM64 Virtualization Lab CI
run-name: "Virtualization Lab CI • ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'virtualization/**'
      - '.github/workflows/franzfon-virtualization-lab-ci.yml'

concurrency:
  group: franzfon-arm64-virtualization-lab
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install script validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate shell scripts
        id: shell
        run: |
          set -euxo pipefail
          bash -n virtualization/qemu/entrypoint.sh
          bash -n virtualization/qemu/labctl.sh
          shellcheck --severity=warning \
            virtualization/qemu/entrypoint.sh \
            virtualization/qemu/labctl.sh

      - name: Validate PowerShell controller
        id: powershell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'virtualization/lab.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Validate Docker Compose
        id: compose
        run: |
          set -euxo pipefail
          docker compose -f virtualization/docker-compose.yml config >/dev/null

      - name: Build QEMU lab image
        id: image
        run: |
          set -euxo pipefail
          docker build -t franzfon-arm64-lab-ci virtualization/qemu

      - name: Verify QEMU tooling and firmware paths
        id: tooling
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/bash franzfon-arm64-lab-ci -lc '
            command -v qemu-system-aarch64
            command -v qemu-img
            command -v cloud-localds
            command -v socat
            test -s /usr/share/AAVMF/AAVMF_CODE.fd
            test -s /usr/share/AAVMF/AAVMF_VARS.fd
          '

      - name: Verify official Debian ARM64 image endpoint
        id: debian
        run: |
          set -euxo pipefail
          curl --fail --location --silent --show-error --head \
            https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-arm64.qcow2 \
            >/dev/null
          curl --fail --location --silent --show-error --head \
            https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS \
            >/dev/null

      - name: Publish virtualization lab verdict
        if: ${{ always() && !cancelled() }}
        run: |
          set -euxo pipefail
          result_dir='analysis-results/virtualization-lab/latest'
          rm -rf "$result_dir"
          mkdir -p "$result_dir"
          {
            echo 'RUN_MARKER=FRANZFON_ARM64_VIRTUALIZATION_LAB_V1'
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo 'SHELL=${{ steps.shell.outcome }}'
            echo 'POWERSHELL=${{ steps.powershell.outcome }}'
            echo 'COMPOSE=${{ steps.compose.outcome }}'
            echo 'IMAGE_BUILD=${{ steps.image.outcome }}'
            echo 'QEMU_TOOLING=${{ steps.tooling.outcome }}'
            echo 'DEBIAN_ENDPOINT=${{ steps.debian.outcome }}'
            echo
            if [ '${{ steps.shell.outcome }}' = success ] \
              && [ '${{ steps.powershell.outcome }}' = success ] \
              && [ '${{ steps.compose.outcome }}' = success ] \
              && [ '${{ steps.image.outcome }}' = success ] \
              && [ '${{ steps.tooling.outcome }}' = success ] \
              && [ '${{ steps.debian.outcome }}' = success ]; then
              echo 'VERDICT=PASS'
            else
              echo 'VERDICT=FAIL'
            fi
          } > "$result_dir/verdict.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add "$result_dir/verdict.txt"
          if ! git diff --cached --quiet; then
            git commit -m 'Update FRANZFON ARM64 virtualization lab verdict'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
