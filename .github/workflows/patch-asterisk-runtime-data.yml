name: Patch Asterisk Runtime Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-asterisk-runtime-data.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish staged Asterisk runtime documentation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('installer/franzfon-arm64-install-asterisk.sh')
          text = path.read_text(encoding='utf-8')

          first_old = '''make DESTDIR="$WORK_DIR/stage" install
          STAGED_BINARY="$WORK_DIR/stage$PREFIX/sbin/asterisk"
          [ -x "$STAGED_BINARY" ] || { echo "Staged Asterisk binary missing: $STAGED_BINARY" >&2; exit 1; }
          '''
          first_new = '''make DESTDIR="$WORK_DIR/stage" install
          STAGED_BINARY="$WORK_DIR/stage$PREFIX/sbin/asterisk"
          [ -x "$STAGED_BINARY" ] || { echo "Staged Asterisk binary missing: $STAGED_BINARY" >&2; exit 1; }

          STAGED_DATA="$WORK_DIR/stage/var/lib/asterisk"
          STAGED_CORE_XML="$(find "$STAGED_DATA/documentation" -maxdepth 1 -type f -name 'core-*.xml' -print -quit 2>/dev/null || true)"
          [ -n "$STAGED_CORE_XML" ] || {
            echo 'Staged Asterisk XML documentation is missing.' >&2
            exit 1
          }
          '''
          if first_old not in text:
              raise SystemExit('Could not find staged installation marker')
          text = text.replace(first_old, first_new, 1)

          second_old = '''install -d -o asterisk -g asterisk -m 0750 \\
            /var/lib/asterisk \\
            /var/log/asterisk \\
            /var/spool/asterisk \\
            /var/spool/asterisk/voicemail \\
            /var/run/asterisk
          install -d -o root -g asterisk -m 0750 /etc/asterisk
          '''
          second_new = '''install -d -o asterisk -g asterisk -m 0750 \\
            /var/lib/asterisk \\
            /var/log/asterisk \\
            /var/spool/asterisk \\
            /var/spool/asterisk/voicemail \\
            /var/run/asterisk
          install -d -o root -g asterisk -m 0750 /etc/asterisk

          rsync -a "$STAGED_DATA/" /var/lib/asterisk/
          chown -R asterisk:asterisk /var/lib/asterisk
          find /var/lib/asterisk/documentation -type d -exec chmod 0755 {} +
          find /var/lib/asterisk/documentation -type f -exec chmod 0644 {} +
          RUNTIME_CORE_XML="$(find /var/lib/asterisk/documentation -maxdepth 1 -type f -name 'core-*.xml' -print -quit)"
          [ -s "$RUNTIME_CORE_XML" ] || {
            echo 'Published Asterisk XML documentation is missing.' >&2
            exit 1
          }
          '''
          if second_old not in text:
              raise SystemExit('Could not find Asterisk runtime directory marker')
          text = text.replace(second_old, second_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          bash -n installer/franzfon-arm64-install-asterisk.sh
          grep -F 'STAGED_DATA="$WORK_DIR/stage/var/lib/asterisk"' installer/franzfon-arm64-install-asterisk.sh
          grep -F 'rsync -a "$STAGED_DATA/" /var/lib/asterisk/' installer/franzfon-arm64-install-asterisk.sh
          grep -F "-name 'core-*.xml'" installer/franzfon-arm64-install-asterisk.sh

      - name: Commit runtime data fix
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer/franzfon-arm64-install-asterisk.sh
          git commit -m 'Install Asterisk XML runtime documentation'
          git pull --rebase origin main
          git push origin HEAD:main
