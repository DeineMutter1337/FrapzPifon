name: Patch FRANZFON First-Boot Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-firstboot-compatibility.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add backend DB user, custom PJSIP file and restart-aware health checks
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('installer/franzfon-arm64-bootstrap.sh')
          text = path.read_text(encoding='utf-8')

          db_old = """CREATE USER IF NOT EXISTS 'asterisk'@'localhost' IDENTIFIED BY '${CDR_DB_PASSWORD}';
          ALTER USER 'asterisk'@'localhost' IDENTIFIED BY '${CDR_DB_PASSWORD}';
          GRANT ALL PRIVILEGES ON asteriskcdrdb.* TO 'asterisk'@'localhost';
          FLUSH PRIVILEGES;
          """
          db_new = """CREATE USER IF NOT EXISTS 'asterisk'@'localhost' IDENTIFIED BY '${CDR_DB_PASSWORD}';
          ALTER USER 'asterisk'@'localhost' IDENTIFIED BY '${CDR_DB_PASSWORD}';
          GRANT ALL PRIVILEGES ON asteriskcdrdb.* TO 'asterisk'@'localhost';
          CREATE USER IF NOT EXISTS 'franzfon'@'localhost' IDENTIFIED BY '${CDR_DB_PASSWORD}';
          ALTER USER 'franzfon'@'localhost' IDENTIFIED BY '${CDR_DB_PASSWORD}';
          GRANT ALL PRIVILEGES ON asteriskcdrdb.* TO 'franzfon'@'localhost';
          FLUSH PRIVILEGES;
          """
          if db_old not in text:
              raise SystemExit('MariaDB user block not found')
          text = text.replace(db_old, db_new, 1)

          db_check_old = """mariadb --protocol=socket --user=asterisk --password="$CDR_DB_PASSWORD" \\
            --database=asteriskcdrdb --execute='SELECT 1' >/dev/null
          """
          db_check_new = """mariadb --protocol=socket --user=asterisk --password="$CDR_DB_PASSWORD" \\
            --database=asteriskcdrdb --execute='SELECT 1' >/dev/null
          mariadb --protocol=socket --user=franzfon --password="$CDR_DB_PASSWORD" \\
            --database=asteriskcdrdb --execute='SELECT 1' >/dev/null
          """
          if db_check_old not in text:
              raise SystemExit('MariaDB verification block not found')
          text = text.replace(db_check_old, db_check_new, 1)

          pjsip_old = """#include pjsip_franzfon.conf
          EOF
          : > /etc/asterisk/pjsip_franzfon.conf
          """
          pjsip_new = """#include pjsip_franzfon.conf
          #include pjsip_custom.conf
          EOF
          : > /etc/asterisk/pjsip_franzfon.conf
          : > /etc/asterisk/pjsip_custom.conf
          """
          if pjsip_old not in text:
              raise SystemExit('PJSIP include block not found')
          text = text.replace(pjsip_old, pjsip_new, 1)

          activation_old = """  systemctl start franzfon-wizard.service
            for _ in $(seq 1 45); do
              if curl --fail --location --silent --max-time 2 http://127.0.0.1:3000/ >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            curl --fail --location --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null
            sed -i 's/^STACK_ENABLED=no$/STACK_ENABLED=yes/' "$STATE_DIR/install-state"
            systemctl --no-pager --full status asterisk.service franzfon-wizard.service
            echo 'FRANZFON ARM64 stack activated successfully.'
          """
          activation_new = """  systemctl start franzfon-wizard.service

            WIZARD_READY=0
            for _ in $(seq 1 60); do
              if curl --fail --location --silent --max-time 2 http://127.0.0.1:3000/ >/dev/null 2>&1; then
                WIZARD_READY=1
                break
              fi
              sleep 1
            done
            [ "$WIZARD_READY" -eq 1 ] || {
              systemctl --no-pager --full status franzfon-wizard.service || true
              journalctl --no-pager -n 100 -u franzfon-wizard.service || true
              echo 'FRANZFON wizard did not become HTTP-ready.' >&2
              exit 1
            }

            # The FRANZFON first-boot routine may rewrite PJSIP files and restart
            # Asterisk once. Require three consecutive healthy checks afterwards.
            ASTERISK_STABLE=0
            for _ in $(seq 1 90); do
              if systemctl is-active --quiet asterisk.service \\
                && "$ASTERISK_PREFIX/sbin/asterisk" -rx 'core show version' >/dev/null 2>&1; then
                ASTERISK_STABLE=$((ASTERISK_STABLE + 1))
                if [ "$ASTERISK_STABLE" -ge 3 ]; then
                  break
                fi
              else
                ASTERISK_STABLE=0
              fi
              sleep 1
            done
            [ "$ASTERISK_STABLE" -ge 3 ] || {
              systemctl --no-pager --full status asterisk.service || true
              journalctl --no-pager -n 150 -u asterisk.service || true
              echo 'Asterisk did not stabilize after FRANZFON first boot.' >&2
              exit 1
            }

            curl --fail --location --silent --show-error --max-time 5 \\
              http://127.0.0.1:3000/ >/dev/null
            "$ASTERISK_PREFIX/sbin/asterisk" -rx 'core show version'
            sed -i 's/^STACK_ENABLED=no$/STACK_ENABLED=yes/' "$STATE_DIR/install-state"
            systemctl --no-pager --full status asterisk.service franzfon-wizard.service
            echo 'FRANZFON ARM64 stack activated successfully.'
          """
          if activation_old not in text:
              raise SystemExit('Activation health-check block not found')
          text = text.replace(activation_old, activation_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          bash -n installer/franzfon-arm64-bootstrap.sh
          grep -F -- "CREATE USER IF NOT EXISTS 'franzfon'@'localhost'" installer/franzfon-arm64-bootstrap.sh
          grep -F -- '#include pjsip_custom.conf' installer/franzfon-arm64-bootstrap.sh
          grep -F -- 'ASTERISK_STABLE=0' installer/franzfon-arm64-bootstrap.sh

      - name: Commit first-boot compatibility fix
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer/franzfon-arm64-bootstrap.sh
          git commit -m 'Handle FRANZFON first-boot Asterisk restart'
          git pull --rebase origin main
          git push origin HEAD:main
