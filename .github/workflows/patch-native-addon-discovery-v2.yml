name: Patch Native Addon Discovery v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-native-addon-discovery-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply path-independent native addon validation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          bootstrap = Path('installer/franzfon-arm64-bootstrap.sh')
          text = bootstrap.read_text(encoding='utf-8')
          pattern = re.compile(
              r'assert_aarch64_elf "\$ASTERISK_PREFIX/sbin/asterisk"\n'
              r'assert_aarch64_elf "\$APP_ROOT/wizard/backend/node_modules/better-sqlite3/build/Release/better_sqlite3\.node"\n'
          )
          replacement = '''assert_aarch64_elf "$ASTERISK_PREFIX/sbin/asterisk"

          NATIVE_ADDON_COUNT=0
          while IFS= read -r -d '' native_addon; do
            assert_aarch64_elf "$native_addon"
            NATIVE_ADDON_COUNT=$((NATIVE_ADDON_COUNT + 1))
          done < <(find -L "$APP_ROOT/wizard/backend/node_modules" -type f -name '*.node' -print0)
          [ "$NATIVE_ADDON_COUNT" -gt 0 ] || {
            echo 'No native Node.js addon was found after npm installation.' >&2
            exit 1
          }
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Bootstrap replacement count was {count}, expected 1')
          bootstrap.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/franzfon-arm64-end-to-end-v3.yml')
          text = workflow.read_text(encoding='utf-8')
          pattern = re.compile(
              r'          ADDON=/opt/franzfon/wizard/backend/node_modules/better-sqlite3/build/Release/better_sqlite3\.node\n'
              r'          test -f "\$ADDON"\n'
              r'          readelf -h "\$ADDON" \| tee report/better-sqlite3-elf\.txt\n'
              r'          readelf -h "\$ADDON" \| awk .*? \| grep -Fx AArch64\n'
          )
          replacement = '''          : > report/native-node-addons-elf.txt
          NATIVE_ADDON_COUNT=0
          while IFS= read -r -d '' native_addon; do
            {
              echo "FILE=$native_addon"
              readelf -h "$native_addon"
              echo
            } >> report/native-node-addons-elf.txt
            readelf -h "$native_addon" | awk '$1 == "Machine:" {print $2}' | grep -Fx AArch64
            NATIVE_ADDON_COUNT=$((NATIVE_ADDON_COUNT + 1))
          done < <(find -L /opt/franzfon/wizard/backend/node_modules -type f -name '*.node' -print0)
          test "$NATIVE_ADDON_COUNT" -gt 0
          echo "NATIVE_ADDON_COUNT=$NATIVE_ADDON_COUNT" | tee report/native-node-addon-count.txt
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'E2E replacement count was {count}, expected 1')
          workflow.write_text(text, encoding='utf-8')
          PY

          bash -n installer/franzfon-arm64-bootstrap.sh
          grep -F 'find -L "$APP_ROOT/wizard/backend/node_modules"' installer/franzfon-arm64-bootstrap.sh
          grep -F 'native-node-addons-elf.txt' .github/workflows/franzfon-arm64-end-to-end-v3.yml

      - name: Commit corrected discovery
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer/franzfon-arm64-bootstrap.sh .github/workflows/franzfon-arm64-end-to-end-v3.yml
          git commit -m 'Discover native Node addons independently of npm layout'
          git pull --rebase origin main
          git push origin HEAD:main
