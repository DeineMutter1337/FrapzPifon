services:
  vm:
    build:
      context: ./qemu
    container_name: franzfon-arm64-lab
    environment:
      VM_CPUS: "4"
      VM_MEMORY_MB: "4096"
      VM_DISK_SIZE: "32G"
    volumes:
      - ./state:/state
    ports:
      - "127.0.0.1:${FRANZFON_LAB_SSH_PORT:-2222}:2222/tcp"
      - "127.0.0.1:${FRANZFON_LAB_WEB_PORT:-13000}:3000/tcp"
      - "127.0.0.1:${FRANZFON_LAB_SIP_PORT:-15060}:5060/udp"
      - "127.0.0.1:${FRANZFON_LAB_WS_PORT:-18088}:8088/tcp"
      - "127.0.0.1:${FRANZFON_LAB_RTP_START:-20000}-${FRANZFON_LAB_RTP_END:-20020}:10000-10020/udp"
    stop_grace_period: 60s
